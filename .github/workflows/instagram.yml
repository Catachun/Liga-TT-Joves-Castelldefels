name: Publicar a Instagram

on:
  push:
    branches: [main]
    paths: ['instagram/queue/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar peces llestes
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node instagram/publish.mjs
      - name: Desar estat (peces ja publicades)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/queue
          git diff --cached --quiet || (git commit -m "Instagram: marcar peces publicades [skip ci]" && git push)
