[build]
  publish = "public"
  functions = "netlify/functions"
  # La clau d'API de Firebase al client (src/firebase.js / bundle.js) és pública
  # per disseny (no és un secret real: la seguretat la donen les Firestore
  # Security Rules, no aquesta clau), així que s'exclou de l'escàner.
  # El README de la funció ja no conté cap valor real de secret.
  [build.environment]
    SECRETS_SCAN_OMIT_PATHS = "public/bundle.js,src/firebase.js"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/bundle.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/bundle.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
